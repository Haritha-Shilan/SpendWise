name: SpendWise CI

on: 
  push: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore SpendWise.sln

      - run: dotnet build SpendWise.sln --no--restore

      
      
          
      
